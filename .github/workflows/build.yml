name: Build AIDesk

# Build unsigned installers on Windows x64 and macOS (recent + previous
# major) for every push to main, every PR, and manual dispatch. On
# tag push (e.g. `0.1.2`) the `release` job also creates a GitHub
# Release and attaches all build artifacts. Code signing +
# notarization aren't wired up — these artifacts are for local QA /
# nightly builds. Add `APPLE_CERTIFICATE` /
# `APPLE_CERTIFICATE_PASSWORD` / `APPLE_SIGNING_IDENTITY` and the
# `WINDOWS_CERTIFICATE` base64 secret to enable signed builds.
#
# The `macos-private-api` Cargo feature (Tauri) only enables wry code
# gated on `#[cfg(target_os = "macos")]`, so enabling it on the
# Windows runner is a no-op there — no special-casing needed.

on:
  push:
    branches: [main]
    tags:
      - "*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS (Sonoma, x86_64)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Type-check + bundle frontend
        run: bun run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        # Unsigned builds for now. To enable signing, re-add the
        # `env:` block with APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD
        # / APPLE_SIGNING_IDENTITY secrets — GitHub's workflow validator
        # rejects empty `env:` blocks containing only comments.
        with:
          args: --target x86_64-apple-darwin

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aidesk-macos-x64
          path: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: warn

  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile || bun install
        shell: bash

      - name: Type-check + bundle frontend
        run: bun run build
        shell: bash

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        # Unsigned builds for now. To enable signing, re-add the
        # `env:` block with WINDOWS_CERTIFICATE /
        # WINDOWS_CERTIFICATE_PASSWORD secrets.
        with:
          args: --target x86_64-pc-windows-msvc

      # Tauri 2 doesn't have a native zip bundle target on Windows —
      # only nsis (.exe installer) and msi (WiX). For a portable
      # archive (raw .exe + DLLs + webview2 + bundled assets), we
      # package the release directory ourselves. Compress-Archive is
      # the built-in PowerShell cmdlet; no extra setup.
      - name: Package portable Windows ZIP
        shell: pwsh
        run: |
          $src = "src-tauri\target\x86_64-pc-windows-msvc\release"
          $dst = "AIDesk-windows-x64"
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          New-Item -ItemType Directory -Path $dst | Out-Null
          # Copy the binary and any companion DLLs/PDBs/assets that
          # Tauri emits next to it.
          Get-ChildItem -Path $src -Filter "*.exe" | Copy-Item -Destination $dst
          Get-ChildItem -Path $src -Filter "*.dll" | Copy-Item -Destination $dst -ErrorAction SilentlyContinue
          # WebView2 runtime files if present (Tauri ships a fixed
          # version when bundle > fixed_runtime).
          if (Test-Path "$src\WebView2Loader.dll") {
            Copy-Item "$src\WebView2Loader.dll" $dst
          }
          Compress-Archive -Path $dst -DestinationPath "AIDesk-windows-x64.zip"
          Remove-Item $dst -Recurse -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aidesk-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            AIDesk-windows-x64.zip
          if-no-files-found: warn

  # Runs only when the workflow is triggered by a tag push. Pulls the
  # build artifacts from the jobs above and attaches them to a GitHub
  # Release for that tag. `softprops/action-gh-release` will fail if
  # the release already exists, which is the desired behavior (we
  # never overwrite a release with new binaries).
  release:
    name: Attach binaries to GitHub Release
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Surface what actually got downloaded. If a build matrix entry
      # silently failed, this shows which artifact is missing before
      # the release step errors out — much easier to debug than a bare
      # "pattern does not match" from softprops.
      - name: List downloaded artifacts
        run: |
          echo "=== top-level ==="
          ls -la artifacts/
          for d in artifacts/*/; do
            echo "=== $d ==="
            ls -la "$d" | head -20
          done

      # Use a recursive glob so nested directories inside the
      # artifact (e.g. the `.app` bundle's `Contents/...`) get
      # attached too, but only the top-level files (not the entire
      # app bundle's internals). `softprops` follows symlinks and
      # zips each matched file individually, so we don't want `**`
      # blowing up the release with thousands of files.
      - name: Create GitHub Release with attached binaries
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          generate_release_notes: true
          fail_on_unmatched_files: false
